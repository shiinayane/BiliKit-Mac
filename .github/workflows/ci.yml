name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun swift-format --version

      - name: Check changed diff whitespace
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Select quality gate
        id: quality-gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          mode=app
          if [[ "${{ github.event_name }}" == "pull_request" ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            mode=$(git diff --name-only "${BASE_SHA}"...HEAD |
              sh Scripts/select-quality-gate.sh)
          fi
          echo "mode=${mode}" >>"$GITHUB_OUTPUT"
          echo "Selected quality gate: ${mode}"

      - name: Run selected quality gate (includes strict Swift format lint)
        run: sh Scripts/run-quality-gates.sh "${{ steps.quality-gate.outputs.mode }}"
