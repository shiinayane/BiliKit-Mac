name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # 每周跑一次完整 Gate，提前发现 runner 镜像或 Xcode 路径变化。
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

# 按事件分组：每周定时运行不会取消 main 的 push 运行（release.py 只认 push 事件的成功记录）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 只维护发布工具链 Xcode 27：完整 Gate（static、package、App 构建与测试），并导出 App 供启动冒烟。
  build-and-test:
    name: Build and test (macos-27)
    outputs:
      gate-mode: ${{ steps.quality-gate.outputs.mode }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun swift-format --version

      - name: Check changed diff whitespace
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Select quality gate
        id: quality-gate
        shell: bash
        env:
          # 只有 PR 提供 base；push、定时与手动运行始终走完整 app Gate（发布依赖 main push 的三环境结果）。
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          mode=app
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            mode=$(git diff --name-only "$BASE_SHA"...HEAD | sh Scripts/select-quality-gate.sh)
          fi
          echo "mode=${mode}" >>"$GITHUB_OUTPUT"
          echo "Selected quality gate: ${mode}"

      - name: Run selected quality gate (includes strict Swift format lint)
        env:
          BILIKIT_APP_OUTPUT: ${{ runner.temp }}/BiliKit.app.tar
          BILIKIT_FAILURE_OUTPUT: ${{ runner.temp }}/gate-failure
        run: sh Scripts/run-quality-gates.sh "${{ steps.quality-gate.outputs.mode }}"

      - name: Upload gate failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-failure-macos-27-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-failure
          if-no-files-found: ignore
          retention-days: 7

      - name: Share app with older macOS runners
        if: steps.quality-gate.outputs.mode == 'app'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ github.sha }}
          path: ${{ runner.temp }}/BiliKit.app.tar
          if-no-files-found: error
          retention-days: 1

  # 较旧系统只启动发布工具链构建的 App，不编译、不跑测试：测试 bundle 依赖随 Xcode 发布的
  # Testing.framework，旧 runner 上的 Xcode 无法加载 27 构建的 bundle，而 Xcode 27 不支持 macOS 15。
  # job 名保留 “Build and test” 以对应 release.py 的三环境检查与分支保护的 required checks。
  # 没有构建 App（static 模式）时在步骤级跳过：job 级 if 会让 matrix 不展开，按系统命名的
  # required checks 永远停在 pending。
  launch-smoke:
    name: Build and test (${{ matrix.os }})
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GATE_MODE: ${{ needs.build-and-test.outputs.gate-mode }}

    steps:
      - name: Skip without app build
        if: env.GATE_MODE != 'app'
        run: echo "Gate mode ${GATE_MODE} built no app; launch smoke skipped."

      - name: Check out repository
        if: env.GATE_MODE == 'app'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show system
        if: env.GATE_MODE == 'app'
        run: sw_vers

      - name: Retrieve app from this workflow
        if: env.GATE_MODE == 'app'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{ github.sha }}
          path: ${{ runner.temp }}/app

      - name: Launch smoke test
        if: env.GATE_MODE == 'app'
        run: sh Scripts/smoke-launch-app.sh "${{ runner.temp }}/app/BiliKit.app.tar"
