name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # 每周跑一次完整 Gate，提前发现 runner 镜像或 Xcode 路径变化。
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 发布工具链（Xcode 27）唯一构建一次：完整 Gate（含 package 测试），并导出 App 测试产物。
  build-and-test:
    name: Build and test (macos-27)
    outputs:
      gate-mode: ${{ steps.quality-gate.outputs.mode }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun swift-format --version

      - name: Check changed diff whitespace
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Select quality gate
        id: quality-gate
        shell: bash
        env:
          # 只有 PR 提供 base；push、定时与手动运行始终走完整 app Gate（发布依赖 main push 的三环境结果）。
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          mode=app
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            mode=$(git diff --name-only "$BASE_SHA"...HEAD | sh Scripts/select-quality-gate.sh)
          fi
          echo "mode=${mode}" >>"$GITHUB_OUTPUT"
          echo "Selected quality gate: ${mode}"

      - name: Run selected quality gate (includes strict Swift format lint)
        env:
          BILIKIT_TEST_PRODUCTS_OUTPUT: ${{ runner.temp }}/test-products.tar
          BILIKIT_FAILURE_OUTPUT: ${{ runner.temp }}/gate-failure
        run: sh Scripts/run-quality-gates.sh "${{ steps.quality-gate.outputs.mode }}"

      - name: Upload gate failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-failure-macos-27-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-failure
          if-no-files-found: ignore
          retention-days: 7

      - name: Share test products with older macOS runners
        if: steps.quality-gate.outputs.mode == 'app'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-products-${{ github.sha }}
          path: ${{ runner.temp }}/test-products.tar
          if-no-files-found: error
          retention-days: 1

  # 较旧系统只运行发布工具链构建的产物、不在本机编译，因此不要求兼容旧 Swift；各用该 runner 上最新的
  # Xcode 驱动测试。static 只检查文本与工程契约，由 macos-27 覆盖；跳过的 job 对 required check 视为通过。
  test-prebuilt:
    name: Build and test (${{ matrix.os }})
    needs: build-and-test
    if: needs.build-and-test.outputs.gate-mode == 'app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            runner: macos-26
            xcode: '26.6'
          - os: macos-15
            runner: macos-15
            xcode: '26.3'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Retrieve test products from this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-products-${{ github.sha }}
          path: ${{ runner.temp }}/test-products

      - name: Run prebuilt app tests
        env:
          BILIKIT_TEST_PRODUCTS_INPUT: ${{ runner.temp }}/test-products/test-products.tar
          BILIKIT_FAILURE_OUTPUT: ${{ runner.temp }}/gate-failure
        run: sh Scripts/run-quality-gates.sh prebuilt

      - name: Upload gate failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-failure-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-failure
          if-no-files-found: ignore
          retention-days: 7
