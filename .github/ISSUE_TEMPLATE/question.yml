name: 使用咨询
description: 使用方法、系统兼容性等问题。
labels: ["类型：咨询"]
body:
  - type: input
    id: version
    attributes:
      label: BiliKit 版本
      description: 在菜单栏「BiliKit → 关于 BiliKit」中查看；还没安装可以不填。
      placeholder: 例如 1.3.2 (10)

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 26.1

  - type: textarea
    id: question
    attributes:
      label: 问题
    validations:
      required: true
