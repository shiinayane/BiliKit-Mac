name: BUG 报告
description: BiliKit 的行为不对、崩溃或播放异常。
labels: ["类型：BUG"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，没有找到相同的问题。
          required: true
        - label: 我已更新到最新版本，问题仍然存在。
          required: true
        - label: 内容中没有 Cookie、token、登录二维码或其他账号信息。
          required: true

  - type: input
    id: version
    attributes:
      label: BiliKit 版本
      description: 在菜单栏「BiliKit → 关于 BiliKit」中查看。
      placeholder: 例如 1.3.2 (10)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      description: 性能相关的问题请顺带写上芯片型号。
      placeholder: 例如 macOS 26.1，M2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的区域
      options:
        - 播放（播放器、音频、画质、字幕）
        - 弹幕
        - 评论（评论、楼中楼、评论图片）
        - 浏览（首页、热门、搜索、UP 主空间）
        - 资料库（观看历史、稍后再看、收藏夹）
        - 账号（登录与会话）
        - 安装与更新
        - 其他
    validations:
      required: true

  - type: dropdown
    id: account
    attributes:
      label: 登录状态
      description: 画质、评论和观看历史都与登录状态有关。
      options:
        - 未登录
        - 已登录
        - 已登录（大会员）

  - type: input
    id: video
    attributes:
      label: 相关视频
      description: 只填 BV 号，或删掉链接中 `?` 之后的部分；分享链接里的参数可能关联到分享人。
      placeholder: 例如 BV1xx411c7mD

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 期望与实际
      description: 你期望看到什么，实际发生了什么。
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 能否稳定复现
      options:
        - 每次都会
        - 偶尔出现
        - 只出现过一次

  - type: textarea
    id: attachments
    attributes:
      label: 截图、录屏或崩溃报告
      description: |
        截图前请遮挡头像与昵称。应用崩溃时，可在「控制台」App 的「崩溃报告」中找到 BiliKit 开头的 .ips 文件并附上。
