sandbox_mode = "workspace-write"
web_search = "indexed"
[mcp_servers.xcode]
enabled = true
required = false
command = "/usr/bin/xcrun"
args = ["mcpbridge"]
env = { DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer" }
startup_timeout_sec = 15.0
tool_timeout_sec = 120.0

[sandbox_workspace_write]
network_access = true
